<h2 mat-dialog-title>Editar funcionario</h2>
<mat-dialog-content>
  <div class="pt-2">
    <p class="mb-4 text-sm text-slate-600">
      La identidad y el documento se sincronizan desde RRHH al asignar una Account.
    </p>
    <form [formGroup]="officerForm" class="space-y-2">
      <mat-form-field>
        <mat-label>Teléfono</mat-label>
        <input formControlName="telefono" inputmode="numeric" matInput />
        @if (officerForm.get('telefono')?.hasError('pattern')) {
          <mat-error>Solo se permiten números</mat-error>
        }
      </mat-form-field>
      <mat-checkbox formControlName="activo"> Habilitado </mat-checkbox>
    </form>
  </div>
</mat-dialog-content>
<mat-dialog-actions align="end">
  <button mat-button color="warn" mat-dialog-close>Cancelar</button>
  <button
    mat-button
    color="primary"
    [disabled]="officerForm.invalid"
    (click)="save()"
  >
    Guardar
  </button>
</mat-dialog-actions>
