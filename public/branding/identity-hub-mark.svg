<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-labelledby="title desc">
  <title id="title">Identity Hub</title>
  <desc id="desc">Símbolo institucional de identidad: círculo teal, escudo blanco y marca de verificación teal.</desc>

  <!-- Contenedor circular -->
